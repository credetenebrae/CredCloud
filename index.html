<script>
// Состояние подсказки (свёрнута / вкладка) читаем до первой отрисовки, чтобы панель не мигала.
// Хранится в cookie; localStorage — запасной вариант для file://, где браузер cookie не сохраняет.
function prefGet(k){const m=document.cookie.match('(?:^|; )'+k+'=([^;]*)');if(m)return decodeURIComponent(m[1]);try{return localStorage.getItem(k)}catch(e){return null}}
function prefSet(k,v){document.cookie=k+'='+encodeURIComponent(v)+'; max-age=31536000; path=/; SameSite=Lax';try{localStorage.setItem(k,v)}catch(e){}}
document.documentElement.classList.toggle('legend-min',prefGet('legend')==='min');
document.documentElement.dataset.tab=prefGet('legendTab')==='ver'?'ver':'help';

<style>
:root{--bg:#eaf3fb;--cloud:#ffffff;--ink:#1d2a3a;--muted:#55657a;--adv:#8b5cf6;--accent:#4a6cf7;--ghost:#ffffff;--ghostline:#8fb0e8;--ui:#26344d;--ui-ink:#eef3fa;--ui-line:rgba(255,255,255,.12);--add:#22a06b;--mod:#d99a00;--del:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1622;--cloud:#1c2636;--ink:#e6edf6;--muted:#9fb0c6;--adv:#b79cff;--accent:#8aa2ff;--ghost:#2e4263;--ghostline:#7d9fe0;--ui:#3a4868;--ui-ink:#f2f5fb;--ui-line:rgba(255,255,255,.14);--add:#4cc38a;--mod:#f5c451;--del:#ff6b6b}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif}
#viewport{position:fixed;inset:0;cursor:grab;touch-action:none;user-select:none}
#viewport.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .5s ease}
#world.noanim{transition:none}
.big{position:absolute;width:1500px;isolation:isolate}
.big .head{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 110px;transition:opacity .25s}
.big .head h2{margin:0;font-size:170px}
.big .head .sub{margin:28px 0 0;font-size:50px}
.cbg{position:absolute;z-index:-1;overflow:visible;pointer-events:none}
.big>.cbg{filter:drop-shadow(0 30px 40px rgba(40,70,120,.18));transition:filter .3s}
.big .cbg .body{fill:var(--cloud)}
.big.orphan>.cbg{filter:none}
.big.orphan>.cbg .body{fill:var(--ghost);opacity:.28}
.cbg .ol{fill:#000;filter:url(#cloudOutline)}
#olFlood{flood-color:var(--ghostline)}
.big.hl>.cbg,.big.orphan.hl>.cbg{filter:drop-shadow(0 0 60px var(--accent)) drop-shadow(0 0 20px var(--accent))}
.big h2{margin:0 0 50px;text-align:center;font-size:150px;line-height:1;letter-spacing:-2px;cursor:pointer}
.big .sub{text-align:center;font-size:44px;color:var(--muted);margin:-30px 0 50px}
.kids{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.big .kids{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0;visibility:hidden;transition:opacity .25s}
.big.show .kids{visibility:visible}
.road .kids{display:none}
.kid{width:400px;padding:34px 40px;position:relative;isolation:isolate}
.kid>.cbg .body{fill:var(--bg)}
.kid.adv>.cbg{display:none}
.kid h3{margin:0 0 12px;font-size:30px}
.kid p{margin:0;font-size:20px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.kid.clipped{cursor:pointer}
.kid.clipped::after{content:"Читать целиком →";display:block;margin-top:10px;font-size:18px;font-weight:600;color:var(--accent)}
.kid.clipped:hover h3{color:var(--accent)}
#reader{border:1px solid color-mix(in srgb,var(--ghostline) 45%,transparent);position:fixed;z-index:30;display:none;width:min(440px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;padding:20px 22px 22px;border-radius:20px;background:var(--cloud);color:var(--ink);box-shadow:0 18px 50px rgba(15,30,60,.35);font-size:16px;line-height:1.6}
#reader.open{display:block;animation:rin .16s ease-out}
@keyframes rin{from{opacity:0;transform:translateY(6px)}}
#reader .rcloud{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:30px}
#reader h3{margin:4px 30px 10px 0;font-size:21px;line-height:1.3}
#reader p{margin:0}
#reader .rclose{position:absolute;right:12px;top:10px;width:30px;height:30px;border:0;border-radius:50%;background:var(--bg);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.kid ul{margin:6px 0 0;padding-left:22px;font-size:20px;line-height:1.45}
.kid.adv{background:transparent;border:3px dashed var(--adv);padding:26px 40px}
.kid.adv h3{color:var(--adv);margin:0}
code{background:rgba(74,108,247,.12);padding:0 6px;border-radius:6px;font-size:.92em}
#hud{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;z-index:5;flex-wrap:wrap}
#hud button{border:1px solid var(--ui-line);border-radius:999px;padding:10px 16px;background:var(--ui);color:var(--ui-ink);font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer}
#legend{position:fixed;right:16px;top:16px;width:300px;max-height:400px;background:var(--ui);color:var(--ui-ink);border:1px solid var(--ui-line);padding:12px 16px 14px;border-radius:18px;font-size:13px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:5;overflow:hidden;transition:width .35s ease,max-height .35s ease,padding .35s ease,border-radius .35s ease}
#legend .lt{width:268px;transition:opacity .18s ease .17s} /* раскрытие: сначала панель растёт, потом проявляется текст */
#legend{max-height:600px}
.tabs{display:flex;gap:4px;padding:3px;margin-bottom:10px;border-radius:999px;background:rgba(255,255,255,.08);width:max-content}
.tabs button{border:0;border-radius:999px;padding:5px 12px;background:none;color:var(--ui-ink);font:12px system-ui,"Segoe UI",sans-serif;cursor:pointer}

#legend .pane{display:none}

.vhead{opacity:.75;margin-bottom:6px}
#vlist{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.28) transparent;max-height:320px;overflow:auto;margin:0 -6px;padding:0 6px}

#vlist::-webkit-scrollbar-track{background:transparent}
#vlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:999px;border:2px solid var(--ui)}
#vlist::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.38)}
#vlist::-webkit-scrollbar-button{display:none;height:0}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:10px;cursor:pointer}
.vrow:hover{background:rgba(255,255,255,.05)}.vrow.on{background:rgba(255,255,255,.09)}
.vrow.br{border-left:3px solid var(--c);border-radius:0 10px 10px 0;margin-left:12px}
.vbr{margin-bottom:8px}
.vhead2{padding-left:4px}
.vrow .hd{display:inline;margin-left:6px;font-size:10px;padding:0 5px;border-radius:4px;background:var(--c);color:#fff;opacity:1}
.vrow code{font:600 12px ui-monospace,Consolas,monospace}
.vrow .rec{font-size:11px;font-weight:600;color:#ffd166}
.vrow .chip{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:11px;color:#fff;background:var(--c)}
.vrow input{accent-color:var(--accent);margin:3px 0 0}
.vrow small{display:block;opacity:.75}
.vrow a{color:var(--ghostline);font-size:12px}
#ldot{position:absolute;right:8px;top:8px;width:14px;height:14px;padding:0;border:0;border-radius:50%;background:var(--accent);cursor:pointer;transition:transform .2s}
#ldot:hover{transform:scale(1.25)}
html.legend-min #legend{width:32px;max-height:32px;padding:0;border-radius:16px} /* 16px, а не 50%: радиус меняется плавно и не режет содержимое на полпути */
html.legend-min #legend .lt{opacity:0;transition:opacity .12s ease} /* сворачивание: текст гаснет сразу, до того как панель сожмётся */
/* точка: right/top 8px — центр кружка 32px (рамка 2×1px → 30px внутри: (30−14)/2 = 8), и это же место в раскрытой панели */
#legend b.a{color:#c4b0ff}
#legend b.o{color:var(--ghostline)}
#links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:10}
#links path{fill:none;stroke:var(--accent);stroke-width:10;stroke-dasharray:30 24;stroke-linecap:round;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-54}}
.road{width:auto;height:auto}
.road h2{font-size:170px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:60px 70px}
.step{position:relative;padding-left:170px;font-size:24px;line-height:1.5}
.num{position:absolute;left:0;top:0;width:140px;height:140px;border-radius:50%;background:var(--accent);color:#fff;font-size:72px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:help;transition:transform .2s}
.num:hover{transform:scale(1.12)}
.step h3{margin:0 0 6px;font-size:40px}
.step .when{color:var(--muted);font-size:22px;margin-bottom:10px}
.step .goal{font-weight:600;margin:8px 0}
.step ul{margin:6px 0;padding-left:28px}
.step a{color:var(--accent)}
#pop{position:fixed;z-index:20;display:none;flex-direction:column;align-items:flex-start;gap:10px;padding:18px 22px 22px;background:var(--cloud);border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-width:340px}
#pop.open{display:flex}
#pop .pt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mini{position:relative;isolation:isolate;border:0;cursor:pointer;font:600 15px system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);padding:12px 20px;border-radius:999px;margin:8px 0 0 4px;transition:transform .15s,background .15s;text-align:left}
.mini::before,.mini::after{content:"";position:absolute;z-index:-1;background:inherit;border-radius:50%}
.mini::before{width:34px;height:34px;left:14px;top:-12px}
.mini::after{width:26px;height:26px;left:40px;top:-8px}
.mini:hover{transform:translateX(4px);background:var(--accent);color:var(--bg)}
.step .to{font-size:20px;color:var(--muted);margin-top:10px}
</style>

<svg width="0" height="0" style="position:absolute"><filter id="cloudOutline" x="-5%" y="-5%" width="110%" height="110%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out" result="ring"/><feFlood id="olFlood"/><feComposite in2="ring" operator="in"/></filter></svg>
<div id="viewport"><div id="world"></div></div>
<div id="hud"><button id="zin">＋</button><button id="zout">－</button><button id="home">Обзор всей карты</button></div>

<script>
const A = t => ({adv:true,t});
const DATA = [
{t:"Основы ИИ",s:"что вообще такое LLM",k:[
 ["Что такое LLM","Большая языковая модель (Claude, GPT, Gemini) предсказывает следующий кусок текста. Она не «знает» твой проект, пока ты не покажешь ей файлы или не опишешь задачу."],
 ["Токены","Модель читает и пишет токенами — кусочками слов (~3–4 символа англ., русский «дороже»). Всё измеряется в токенах: лимиты, скорость, цена."],
 ["Контекстное окно","Сколько токенов модель «держит в голове» за раз: твои сообщения, файлы, ответы. Когда окно переполняется, старое сжимается или забывается — поэтому длинные чаты деградируют."],
 ["Галлюцинации","Модель может уверенно выдумать функцию, библиотеку или API. Лекарство: проверять запуском, просить ссылки на документацию, давать актуальные доки в контекст."],
 ["Модели и их размеры","Большие (Opus) — умнее, медленнее, дороже. Средние (Sonnet) — рабочая лошадка. Маленькие (Haiku) — быстрые и дешёвые для простых задач. Выбирай под задачу."],
 ["Чат vs агент","Чат — отвечает текстом. Агент — сам читает файлы, запускает команды, правит код в цикле, пока задача не готова. Вайбкодинг = работа с агентом."],
 A("Как устроены трансформеры / attention"),A("Temperature, top-p и параметры сэмплинга"),A("Reasoning / extended thinking под капотом")]},
{t:"Промптинг",s:"как разговаривать с ИИ",k:[
 ["Контекст → задача → критерий","Хороший промпт: что за проект и где файлы; что сделать; как понять что готово. «В src/Header.tsx добавь мобильное меню-бургер, на ширине < 768px, анимация открытия 200мс»."],
 ["Конкретика вместо «сделай красиво»","Называй цвета, отступы, референсы, библиотеки. «Как у Linear: тёмный фон, тонкие границы 1px, шрифт Inter». Чем точнее — тем меньше переделок."],
 ["Маленькие шаги","Не «сделай весь сайт», а «сначала шапку», «теперь карточки товаров». Каждый шаг проверяй глазами в браузере, потом коммить."],
 ["Показывай, а не описывай","Скриншот бага, картинка макета, ссылка на Figma, текст ошибки из консоли целиком. Агент видит изображения."],
 ["Сначала план","«Не пиши код, сначала предложи план» — дешёвый способ поймать неверное понимание задачи до того, как потрачены токены на код."],
 ["Ограничения","Говори что НЕ трогать: «не меняй API», «не добавляй новые зависимости», «только CSS»."],
 ["Обратная связь","Если результат плохой — объясни ЧТО не так, а не «переделай». Если ушло совсем не туда — откати и начни заново с лучшим промптом, это дешевле."],
 ["Язык","Можно писать по-русски — модели понимают отлично. Имена файлов и терминов оставляй как в коде."]]},
{t:"Инструменты",s:"где вайбкодить",k:[
 ["Claude Code","Агент в терминале / десктоп-приложении / IDE. Работает прямо с файлами на твоём ПК, запускает команды, поддерживает скиллы, MCP, хуки."],
 ["Cursor, Windsurf","Редакторы кода (на базе VS Code) со встроенным ИИ-агентом. Удобно видеть код и правки рядом."],
 ["GitHub Copilot","Автодополнение и агент внутри VS Code / JetBrains."],
 ["v0, Lovable, Bolt","Браузерные генераторы: описал — получил готовый сайт с превью. Отлично для старта и прототипов, сложнее для больших проектов."],
 ["Что выбрать новичку","Начни с одного: например Claude Code + VS Code. Не прыгай между десятью тулами — навык промптинга переносится, а время на освоение — нет."]]},
{t:"Скиллы (Skills)",s:"пакеты инструкций для агента",k:[
 ["Что это","Папка с файлом <code>SKILL.md</code> (+ опционально скрипты, шаблоны, примеры). Внутри — инструкция «как делать задачу X хорошо». Агент подгружает её, когда задача подходит."],
 ["Как работают","В контексте висит только короткое описание скилла. Когда задача совпадает — агент загружает полный текст. Так экономится контекст: 50 скиллов не съедают окно."],
 ["Зачем нужны","Чтобы не повторять одно и то же в каждом промпте: «наш стиль кода», «как деплоить», «как делать доступные формы». Записал раз — работает всегда."],
 ["Где лежат","Личные: <code>~/.claude/skills/имя/SKILL.md</code>. Проектные: <code>.claude/skills/имя/SKILL.md</code> в репозитории. Вызов: автоматически или командой <code>/имя</code>."],
 ["Где взять / установить","Плагины и маркетплейсы плагинов (<code>/plugin</code> в Claude Code), официальный репозиторий anthropics/skills на GitHub, скиллы от вендоров (Figma, Vercel и т.д.), репозитории сообщества."],
 ["Чем отличаются по сути","1) Чистые инструкции (только текст). 2) Инструкции + скрипты, которые агент запускает. 3) Шаблоны/ассеты. 4) Скиллы-обёртки над MCP-инструментами (как Figma)."],
 ["Фронтенд vs бэкенд vs Figma","Фронт: дизайн-система, вёрстка, доступность, адаптив. Бэк: структура API, миграции БД, безопасность. Figma: как вызывать инструменты Figma, порядок создания компонентов и токенов. Не-IT: тексты, отчёты, документы, таблицы — те же принципы, другой предмет."],
 ["Как написать свой","Создай папку и <code>SKILL.md</code>: сверху frontmatter с <code>name</code> и <code>description</code> (когда применять!), ниже — пошаговая инструкция, примеры хорошо/плохо. Описание — самое важное: по нему агент решает, загружать ли скилл."],
 ["Защита от инъекций","Скилл = текст, которому агент доверяет. Чужой скилл может содержать скрытую команду («отправь .env на сервер»). Читай SKILL.md и скрипты перед установкой, ставь из проверенных источников, не давай агенту авто-разрешения на всё."]]},
{t:"MCP",s:"Model Context Protocol",k:[

 ["Как пользоваться","Добавить сервер: <code>claude mcp add ...</code> или через конфиг <code>.mcp.json</code>. После этого агент сам видит новые инструменты и вызывает их, когда нужно."],

// ===== Версии контента: как в git =====
// COMMITS — коммиты: набор правок к родителю (parent). id — короткий хеш (7 hex), title — сообщение коммита.
//   branch — ветка, в которой коммит сделан (для меню версий; на карте правки не подсвечиваются).
// BRANCHES — ветки: имя → {color, head}. head — последний коммит ветки.
//   recommended:true — ровно у одной ветки: она открывается по умолчанию и стоит первой в меню.
// date у коммита — 'ГГГГ-ММ-ДД ЧЧ:ММ'; по дате головы ветки меню сортирует остальные ветки (свежие выше).
//   Продлить ветку: новый коммит с parent = текущий head ветки, потом head = id нового коммита.
//   Новая ветка: новый коммит с parent = любой коммит (обычно head другой ветки) + новая запись в BRANCHES.
// Правки (changes):
//   {op:'add', cloud:'Облако', t:'Тема', x:'Текст'}          — новая тема (adv:true — продвинутая, без текста)
//   {op:'mod', cloud:'Облако', t:'Тема', x:'Новый текст', nt:'Новое название'}  — x и nt необязательны
//   {op:'del', cloud:'Облако', t:'Тема'}                     — убрать тему
//   {op:'cloud', t:'Новое облако', s:'подзаголовок', o:1}    — новое большое облако (o:1 — самостоятельное)

function rng(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647}}
function cloudify(el,seed,big){
  const w=el.offsetWidth,h=el.offsetHeight,R=rng(seed+7);
  const r=Math.min(big?260:70,Math.max(big?120:34,Math.min(w,h)*0.17)),m=r*2;
  let c=`<rect x="0" y="0" width="${w}" height="${h}" rx="${r}"/>`;
  const ext={l:0,t:0,r:0,b:0};
  const edge=(x1,y1,x2,y2,lo,hi)=>{const len=Math.hypot(x2-x1,y2-y1),n=Math.max(2,Math.round(len/(r*1.25)));
    for(let i=0;i<=n;i++){const t=i/n,rr=r*(lo+R()*(hi-lo)),cx=x1+(x2-x1)*t+(R()-.5)*r*.3,cy=y1+(y2-y1)*t;c+=`<circle cx="${cx}" cy="${cy}" r="${rr}"/>`;
      ext.l=Math.max(ext.l,rr-cx);ext.t=Math.max(ext.t,rr-cy);ext.r=Math.max(ext.r,cx+rr-w);ext.b=Math.max(ext.b,cy+rr-h)}};
  const ins=r*0.35;
  edge(ins,ins,w-ins,ins,1.0,1.6);        // верх — крупные пуфы
  edge(w-ins,ins,w-ins,h-ins,0.8,1.2);    // право
  edge(w-ins,h-ins,ins,h-ins,0.7,1.0);    // низ — плоский
  edge(ins,h-ins,ins,ins,0.8,1.2);        // лево
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','cbg');svg.setAttribute('width',w+2*m);svg.setAttribute('height',h+2*m);
  svg.style.left=-m+'px';svg.style.top=-m+'px';
  svg.innerHTML=`<g transform="translate(${m},${m})">${el.classList.contains("orphan")?`<g class="ol">${c}</g>`:""}<g class="body">${c}</g></g>`;
  el.prepend(svg);
  return ext;
}

  HP.set('v',SEL);HP.set('x',Math.round(cx));HP.set('y',Math.round(cy));HP.set('z',+s.toFixed(4));
  history.replaceState(null,'','#'+HP.toString());
  try{localStorage.setItem('pos',JSON.stringify({x:cx,y:cy,z:s}))}catch(e){}},300)}
function restorePos(p){if(!p||![p.x,p.y,p.z].every(Number.isFinite)||p.z<=0)return false;
  s=Math.min(8,Math.max(0.03,p.z));x=innerWidth/2-p.x*s;yy=innerHeight/2-p.y*s;apply(false);return true}
function apply(anim){world.classList.toggle('noanim',!anim);world.style.transform=`translate(${x}px,${yy}px) scale(${s})`;savePos();
  if(!lodRaf)lodRaf=requestAnimationFrame(updateLOD);}
// Облако в центре экрана: чем крупнее на экране его текст, тем прозрачнее заголовок и плотнее темы.
// Остальные облака — только заголовок, темы скрыты (visibility:hidden — браузер их не рисует).
const TXT=20,LOD_FROM=4,LOD_TO=9;   // экранный размер текста темы (px): с 4 начинает проявляться, к 9 — полностью
let lodRaf=0;
function updateLOD(){lodRaf=0;
  const cx=(innerWidth/2-x)/s,cy=(innerHeight/2-yy)/s,near=300/s;let best=null,bd=Infinity;
  for(const c of DATA){const L=c.el.offsetLeft,T=c.el.offsetTop,d=Math.hypot(Math.max(L-cx,0,cx-L-c.el.offsetWidth),Math.max(T-cy,0,cy-T-c.el.offsetHeight));if(d<bd){bd=d;best=c}}
  if(bd>near)best=null;
  for(const c of DATA){const t=c===best?Math.min(1,Math.max(0,(TXT*c.scale*s-LOD_FROM)/(LOD_TO-LOD_FROM))):0;
    if(c.t===t)continue;c.t=t;c.head.style.opacity=1-t;c.kw.style.opacity=t;c.el.classList.toggle('show',t>0)}}
// клик по облаку: приблизить так, чтобы темы сразу читались
function zoomToCloud(b){const c=DATA.find(c=>c.el===b);const need=c?LOD_TO/(TXT*c.scale):0;
  fit(b.offsetLeft,b.offsetTop,b.offsetWidth,b.offsetHeight);if(s<need){const px=b.offsetLeft+b.offsetWidth/2,py=b.offsetTop+b.offsetHeight/2;s=need;x=innerWidth/2-px*s;yy=innerHeight/2-py*s;apply(true)}}
function fit(rx,ry,rw,rh,anim=true){const vw=innerWidth,vh=innerHeight;s=Math.min(vw/rw,vh/rh)*0.92;x=(vw-rw*s)/2-rx*s;yy=(vh-rh*s)/2-ry*s;apply(anim)}
function home(){fit(0,0,W,H)}
function zoomAt(f,cx,cy){const ns=Math.min(8,Math.max(0.03,s*f));x=cx-(cx-x)*ns/s;yy=cy-(cy-yy)*ns/s;s=ns;apply(false)}
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY)},{passive:false});
// перетаскивание + щипок
const ptrs=new Map();let moved=0,pd=0;
vp.addEventListener('pointerdown',e=>{if(e.target.closest('a,.num'))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;vp.classList.add('drag')});
addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){x+=e.clientX-p.x;yy+=e.clientY-p.y;moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);apply(false)}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)zoomAt(d/pd,(a.x+b.x)/2,(a.y+b.y)/2);pd=d;moved=99}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pd=0;if(!ptrs.size)vp.classList.remove('drag')};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
vp.addEventListener('click',e=>{if(moved>6)return;if(e.target.closest('a'))return;const ck=e.target.closest('.kid.clipped');if(ck){readerKid===ck?closeReader():openReader(ck);return}const b=e.target.closest('.big');if(!b||b.classList.contains('road')||b.classList.contains('show'))return;zoomToCloud(b)});
document.getElementById('zin').onclick=()=>zoomAt(1.4,innerWidth/2,innerHeight/2);
document.getElementById('zout').onclick=()=>zoomAt(1/1.4,innerWidth/2,innerHeight/2);
document.getElementById('home').onclick=home;
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(readerKid)closeReader();else home()});
// при загрузке: координаты из адреса → последнее положение → (только при первом заходе) роадмап
let savedPos=null;try{savedPos=JSON.parse(localStorage.getItem('pos')||'null')}catch(e){}
if(!restorePos(HP.has('z')?{x:+HP.get('x'),y:+HP.get('y'),z:+HP.get('z')}:null)&&!restorePos(savedPos))
  fit(road.offsetLeft,road.offsetTop-200,road.offsetWidth,road.offsetHeight+400,false);
</script>
</body>
